[project]
name = "robot-training-hub"
version = "0.1.0"
description = "Durable workshop coordinator and GPU workers for Booster K1 mjlab"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "email-validator>=2.2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
worker = ["tensorboard>=2.18,<3"]
[project.scripts]
robot-hub = "hub.cli:main"
robot-worker = "hub.worker:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["hub"]
[tool.pytest.ini_options]
testpaths = ["tests"]
